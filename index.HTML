<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로아 전투력 대시보드</title>
<style>
  /* 기본 설정 및 어두운 배경 */
  :root {
    --bg-dark: #121212;
    --panel-bg: #1e1e1e;
    --text-main: #e0e0e0;
    --text-sub: #888;
    --accent: #D4AF37; /* 로스트아크 느낌의 골드 색상 */
  }
  
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Pretendard', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 상단 바 (사이트 이름 & 날짜/시간) ── */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 30px 40px;
  }

  .site-title {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.5px;
    text-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
  }

  .datetime-display {
    text-align: right;
    font-size: 1rem;
    color: var(--text-sub);
    line-height: 1.5;
  }
  .datetime-display .time {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--text-main);
    font-variant-numeric: tabular-nums;
  }

  /* ── 중앙 메인 콘텐츠 (검색창) ── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center; /* 화면 정중앙 배치 */
    padding: 0 20px;
    margin-top: -10vh; /* 시각적으로 완벽한 중앙을 위해 살짝 위로 */
  }

  .search-container {
    width: 100%;
    max-width: 600px;
    text-align: center;
    animation: fadeIn 0.8s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .search-title {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 30px;
    letter-spacing: -1px;
  }
  .search-title span {
    color: var(--accent);
  }

  .search-box {
    position: relative;
    width: 100%;
    margin-bottom: 20px;
  }

  .search-box input {
    width: 100%;
    padding: 20px 30px;
    font-size: 1.2rem;
    background-color: var(--panel-bg);
    border: 2px solid #333;
    border-radius: 50px;
    color: var(--text-main);
    outline: none;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .search-box input::placeholder {
    color: #555;
  }

  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
  }

  .search-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--accent);
    font-size: 1.5rem;
    cursor: pointer;
    padding: 10px;
    transition: transform 0.2s;
  }

  .search-btn:hover {
    transform: translateY(-50%) scale(1.1);
  }

  /* 검색창 아래 메뉴칸 (탭) */
  .menu-tabs {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
    border-top: 1px solid #333;
    padding-top: 20px;
  }

  .menu-tabs button {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    padding: 5px 10px;
    transition: color 0.2s;
    position: relative;
  }

  .menu-tabs button:hover, .menu-tabs button.active {
    color: var(--text-main);
  }

  .menu-tabs button.active::after {
    content: '';
    position: absolute;
    bottom: -21px;
    left: 0;
    width: 100%;
    height: 2px;
    background-color: var(--accent);
  }

  /* 에러 메시지 영역 (숨겨둠) */
  .error-message {
    margin-top: 20px;
    color: #ff4d4f;
    font-size: 0.9rem;
    display: none;
    background: rgba(255, 77, 79, 0.1);
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid rgba(255, 77, 79, 0.3);
  }

</style>
</head>
<body>

  <!-- 상단 바 -->
  <header>
    <!-- 왼쪽 상단: 사이트 이름 -->
    <div class="site-title">LOA COMBAT RECORD</div>
    
    <!-- 오른쪽 상단: 날짜 및 시간 -->
    <div class="datetime-display">
      <div id="dateText">2026년 11월 06일 (금)</div>
      <div class="time" id="timeText">00:00:00</div>
    </div>
  </header>

  <!-- 중앙 메인 콘텐츠 -->
  <main>
    <div class="search-container">
      
      <div class="search-title">원하는 <span>캐릭터</span>를 검색하세요</div>

      <!-- 검색창 -->
      <div class="search-box">
        <input type="text" id="charInput" placeholder="캐릭터 이름을 입력해주세요." autocomplete="off">
        <button class="search-btn" id="searchBtn">🔍</button>
      </div>

      <div class="error-message" id="errorMsg">
        <!-- 여기에 에러 메시지가 표시됩니다 -->
      </div>

      <!-- 검색창 아래 메뉴칸 -->
      <div class="menu-tabs">
        <button class="active">전투력 기록</button>
        <button>랭킹</button>
        <button>즐겨찾기</button>
      </div>

    </div>
  </main>

<script>
  // ── 1. 실시간 날짜 및 시간 업데이트 ──
  function updateTime() {
    const now = new Date();
    
    // 날짜 포맷 (예: 2026년 11월 06일 (금))
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = String(now.getDate()).padStart(2, '0');
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const day = days[now.getDay()];
    
    document.getElementById('dateText').textContent = `${year}년 ${month}월 ${date}일 (${day})`;
    
    // 시간 포맷 (예: 14:30:05)
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    
    document.getElementById('timeText').textContent = `${hours}:${minutes}:${seconds}`;
  }

  // 1초마다 시간 업데이트
  setInterval(updateTime, 1000);
  updateTime(); // 페이지 로드 시 즉시 실행

  // ── 2. 검색 버튼 및 엔터키 이벤트 (임시) ──
  const charInput = document.getElementById('charInput');
  const searchBtn = document.getElementById('searchBtn');
  const errorMsg = document.getElementById('errorMsg');

  function searchCharacter() {
    const name = charInput.value.trim();
    if (!name) {
      showError("캐릭터 이름을 입력해주세요.");
      return;
    }
    
    // 아직 검색 화면이 없으므로 임시 알림
    // 나중에 이 부분을 '검색 결과 화면으로 전환'하는 로직으로 바꿀 거야!
    alert(`[${name}] 캐릭터를 검색합니다.\n(다음 단계에서 이 화면이 열릴 예정!)`);
    
    hideError();
  }

  searchBtn.addEventListener('click', searchCharacter);
  charInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchCharacter();
  });

  // 에러 메시지 표시/숨기기 함수
  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }
  function hideError() {
    errorMsg.style.display = 'none';
  }

</script>
</body>
</html>
