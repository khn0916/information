<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로아 전투력 대시보드 - 에러 모달</title>
<style>
  /* 고급스러운 다크 테마 팔레트 */
  :root {
    --bg-base: #0B0E14;       
    --bg-gradient: radial-gradient(circle at top, #1A202C 0%, #0B0E14 100%);
    --panel-bg: rgba(30, 35, 45, 0.6); 
    --text-main: #F8FAFC;     
    --text-sub: #94A3B8;      
    --accent-gold: #D4AF37;   
    --accent-glow: rgba(212, 175, 55, 0.4);
    --danger-red: #F87171;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-base);
    background-image: var(--bg-gradient);
    color: var(--text-main);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .screen { display: none; width: 100%; height: 100%; flex-direction: column; position: relative; z-index: 10; }
  .screen.active { display: flex; animation: fadeIn 0.4s ease-out; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* [메인 화면] 스타일 */
  header { display: flex; justify-content: space-between; align-items: flex-start; padding: 40px 50px; }
  .site-title {
    font-size: 1.6rem; font-weight: 900; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #FDE047 0%, #D4AF37 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-shadow: 0 4px 15px var(--accent-glow);
  }
  .datetime-display { text-align: right; font-size: 0.95rem; color: var(--text-sub); line-height: 1.6; letter-spacing: 0.5px; }
  .datetime-display .time { font-size: 1.8rem; font-weight: 700; color: var(--text-main); font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(255,255,255,0.1); }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 20px; margin-top: -8vh; }
  .search-container { width: 100%; max-width: 680px; text-align: center; }
  .search-title { font-size: 2.2rem; font-weight: 700; margin-bottom: 40px; letter-spacing: -1px; }
  .search-title span { color: var(--accent-gold); text-shadow: 0 0 20px var(--accent-glow); }
  
  .search-box { position: relative; width: 100%; margin-bottom: 25px; }
  .search-box input {
    width: 100%; padding: 22px 35px; font-size: 1.25rem; background-color: var(--panel-bg);
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50px; color: var(--text-main); outline: none;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
  }
  .search-box input::placeholder { color: #64748B; }
  .search-box input:focus { border-color: var(--accent-gold); background-color: rgba(30, 35, 45, 0.9); box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 0 30px rgba(212, 175, 55, 0.15); }
  
  .search-btn {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: #64748B; cursor: pointer; padding: 10px;
    display: flex; align-items: center; justify-content: center; transition: all 0.3s ease; border-radius: 50%;
  }
  .search-btn svg { width: 24px; height: 24px; stroke-width: 2.5; }
  .search-box input:focus + .search-btn, .search-btn:hover { color: var(--accent-gold); filter: drop-shadow(0 0 8px var(--accent-glow)); }

  .menu-tabs { display: flex; justify-content: center; gap: 20px; margin-top: 30px; border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 25px; }
  .menu-tabs button { background: none; border: none; color: var(--text-sub); font-size: 1.05rem; font-weight: 600; cursor: pointer; padding: 8px 16px; transition: all 0.3s ease; position: relative; }
  .menu-tabs button.active { color: var(--accent-gold); }
  .menu-tabs button.active::after { content: ''; position: absolute; bottom: -26px; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, transparent, var(--accent-gold), transparent); box-shadow: 0 0 10px var(--accent-gold); }

  /* [검색 결과 화면] 스타일 (이전과 동일) */
  .result-header { padding: 30px 50px; display: flex; align-items: center; gap: 20px; }
  .btn-back { background: var(--panel-bg); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-main); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; }
  .btn-back:hover { background: rgba(255, 255, 255, 0.1); }
  .result-container { flex: 1; padding: 0 50px 40px 50px; overflow-y: auto; max-width: 1400px; margin: 0 auto; width: 100%; }
  .dashboard-grid { display: grid; grid-template-columns: 320px 1fr; gap: 30px; }
  .panel { background: var(--panel-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
  .char-summary { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .char-image { width: 100%; aspect-ratio: 1 / 1; background: #1e232d; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; border: 1px dashed #444; }
  .char-image svg { width: 120px; height: 120px; fill: #333; }
  .char-nickname { font-size: 1.8rem; font-weight: 800; color: var(--text-main); margin-bottom: 5px; }
  .char-class { font-size: 1rem; color: var(--accent-gold); margin-bottom: 20px; font-weight: bold; }
  .char-stat-row { width: 100%; display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
  .char-stat-row:last-child { border-bottom: none; }
  .char-stat-label { color: var(--text-sub); font-size: 1.05rem; }
  .char-stat-value { font-weight: bold; font-size: 1.2rem; }
  .combat-power-value { color: var(--accent-gold); font-size: 1.4rem; text-shadow: 0 0 15px var(--accent-glow); }
  .right-column { display: flex; flex-direction: column; gap: 30px; }
  .graph-panel { height: 350px; display: flex; flex-direction: column; position: relative; }
  .graph-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .graph-title { font-size: 1.2rem; font-weight: bold; }
  .graph-time { font-size: 0.9rem; color: var(--text-sub); }
  .graph-scroll-container { flex: 1; width: 100%; overflow-x: auto; overflow-y: hidden; padding-bottom: 10px; }
  .graph-scroll-container::-webkit-scrollbar { height: 8px; }
  .graph-scroll-container::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 4px; }
  .graph-scroll-container::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  .graph-scroll-container::-webkit-scrollbar-thumb:hover { background: #555; }
  .graph-area { position: relative; width: 100%; height: 100%; padding: 10px 20px 30px 50px; }
  .custom-chart { width: 800px; height: 100%; overflow: visible; }
  .grid-line { stroke: rgba(255, 255, 255, 0.05); stroke-width: 1; stroke-dasharray: 4 4; }
  .axis-line { stroke: #444; stroke-width: 1.5; }
  .axis-text { fill: var(--text-sub); font-size: 12px; font-family: sans-serif; }
  .chart-line { fill: none; stroke: var(--accent-gold); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 8px var(--accent-glow)); }
  .chart-dot { fill: #fff; stroke: var(--accent-gold); stroke-width: 2; cursor: pointer; transition: r 0.2s ease, fill 0.2s ease; }
  .chart-dot:hover { r: 7; fill: var(--accent-gold); }
  .equipment-panel { flex: 1; min-height: 200px; }
  .eq-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 20px; }
  .eq-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 20px; }
  .eq-item { aspect-ratio: 1; background: #1e232d; border-radius: 8px; border: 1px solid #333; display: flex; justify-content: center; align-items: center; font-size: 0.85rem; color: #888; font-weight: bold; }
  .extra-info { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .extra-box { background: rgba(30, 35, 45, 0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 15px; text-align: center; color: var(--text-sub); font-size: 0.9rem; }

  /* ── 툴팁 스타일 ── */
  #chartTooltip {
    position: absolute;
    background: rgba(15, 20, 30, 0.95);
    color: #fff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.85rem;
    pointer-events: none;
    border: 1px solid var(--accent-gold);
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    display: none;
    z-index: 100;
    transform: translate(-50%, -120%);
    white-space: nowrap;
  }
  #chartTooltip::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%);
    border-width: 6px 6px 0 6px;
    border-style: solid;
    border-color: var(--accent-gold) transparent transparent transparent;
  }
  .tooltip-date { color: var(--text-sub); font-size: 0.75rem; margin-bottom: 3px; }
  .tooltip-value { font-weight: bold; color: var(--accent-gold); font-size: 1rem; }

  /* ═══════════════════════════════════════
     [새로 추가된 에러 모달창 스타일]
     ═══════════════════════════════════════ */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(5px);
    display: none; /* 기본적으로 숨김 */
    justify-content: center;
    align-items: center;
    z-index: 9999;
  }
  .modal-overlay.show {
    display: flex;
    animation: fadeInModal 0.3s ease-out;
  }
  
  @keyframes fadeInModal {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .error-modal {
    background: #1A202C;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 30px 40px;
    display: flex;
    align-items: center;
    gap: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    max-width: 450px;
    width: 90%;
  }

  /* 캐릭터 이미지 박스 */
  .error-icon-box {
    width: 100px;
    height: 100px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  
  /* ⚠️ 여기에 네가 가진 캐릭터 이미지 파일 이름을 넣어줘! (예: tear.png) */
  .error-icon-box img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 0 10px rgba(248, 113, 113, 0.3)); /* 은은한 붉은 빛 */
  }

  .error-content {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .error-title {
    font-size: 1.3rem;
    font-weight: bold;
    color: var(--danger-red);
  }

  .error-desc {
    font-size: 1rem;
    color: var(--text-main);
    line-height: 1.5;
    word-break: keep-all;
  }

  .btn-close-modal {
    margin-top: 10px;
    align-self: flex-end;
    padding: 8px 16px;
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
  }
  .btn-close-modal:hover {
    background: rgba(255,255,255,0.2);
  }

</style>
</head>
<body>

  <!-- [화면 1] 메인 화면 -->
  <div id="mainScreen" class="screen active">
    <header>
      <div class="site-title">LOA COMBAT RECORD</div>
      <div class="datetime-display">
        <div id="dateText">0000년 00월 00일 (월)</div>
        <div class="time" id="timeText">00:00:00</div>
      </div>
    </header>

    <main>
      <div class="search-container">
        <div class="search-title">나의 <span>전투력</span>을 기록하세요</div>

        <div class="search-box">
          <input type="text" id="charInput" placeholder="원하는 캐릭터의 이름을 입력하세요." autocomplete="off">
          <button class="search-btn" id="searchBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>

        <div class="menu-tabs">
          <button class="active">전투력 기록</button>
          <button>전체 랭킹</button>
          <button>즐겨찾기</button>
        </div>
      </div>
    </main>
  </div>

  <!-- [화면 2] 검색 결과 (대시보드) -->
  <div id="resultScreen" class="screen">
    <div class="result-header">
      <button class="btn-back" id="btnBack">← 돌아가기</button>
    </div>
    
    <div class="result-container">
      <div class="dashboard-grid">
        
        <!-- 왼쪽: 캐릭터 요약 카드 -->
        <div class="panel char-summary">
          <div class="char-image">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          </div>
          
          <div class="char-nickname" id="resNickname">불효자의움직임</div>
          <div class="char-class" id="resClass">데빌헌터 (카단)</div>
          
          <div class="char-stat-row">
            <span class="char-stat-label">아이템 레벨</span>
            <span class="char-stat-value" id="resItemLevel">1,759.16</span>
          </div>
          <div class="char-stat-row">
            <span class="char-stat-label">전투력</span>
            <span class="char-stat-value combat-power-value" id="resCombatPower">5,298.38</span>
          </div>
          <div class="char-stat-row">
            <span class="char-stat-label">칭호</span>
            <span class="char-stat-value" id="resTitle">빛의 수호자</span>
          </div>
        </div>

        <!-- 오른쪽: 성장 그래프 및 장비 -->
        <div class="right-column">
          
          <!-- 성장 그래프 패널 -->
          <div class="panel graph-panel">
            <div class="graph-header">
              <div class="graph-title">전투력 성장 그래프</div>
              <div class="graph-time" id="resUpdateTime">출력시각: 2026-11-06 15:30</div>
            </div>
            
            <div class="graph-scroll-container">
              <div class="graph-area">
                <svg class="custom-chart" viewBox="0 0 800 200" preserveAspectRatio="none">
                  <line x1="0" y1="0" x2="800" y2="0" class="grid-line" />
                  <line x1="0" y1="50" x2="800" y2="50" class="grid-line" />
                  <line x1="0" y1="100" x2="800" y2="100" class="grid-line" />
                  <line x1="0" y1="150" x2="800" y2="150" class="grid-line" />

                  <line x1="0" y1="0" x2="0" y2="200" class="axis-line" /> 
                  <line x1="0" y1="200" x2="800" y2="200" class="axis-line" /> 

                  <text x="-10" y="5" class="axis-text" text-anchor="end">5300</text>
                  <text x="-10" y="55" class="axis-text" text-anchor="end">5250</text>
                  <text x="-10" y="105" class="axis-text" text-anchor="end">5200</text>
                  <text x="-10" y="155" class="axis-text" text-anchor="end">5150</text>
                  <text x="-10" y="205" class="axis-text" text-anchor="end">5100</text>

                  <g text-anchor="middle">
                    <text x="50" y="220" class="axis-text">11/01</text>
                    <text x="150" y="220" class="axis-text">11/02</text>
                    <text x="250" y="220" class="axis-text">11/03</text>
                    <text x="350" y="220" class="axis-text">11/04</text>
                    <text x="450" y="220" class="axis-text">11/05</text>
                    <text x="550" y="220" class="axis-text">11/06</text>
                    <text x="650" y="220" class="axis-text">11/07</text>
                    <text x="750" y="220" class="axis-text">11/08</text>
                  </g>

                  <polyline class="chart-line" points="50,180 150,140 250,100 350,60 450,20 550,25 650,10 750,5" />
                  
                  <circle cx="50" cy="180" r="5" class="chart-dot" data-date="2026-11-01" data-level="1,740.10" data-power="5,120" />
                  <circle cx="150" cy="140" r="5" class="chart-dot" data-date="2026-11-02" data-level="1,745.20" data-power="5,155" />
                  <circle cx="250" cy="100" r="5" class="chart-dot" data-date="2026-11-03" data-level="1,750.00" data-power="5,200" />
                  <circle cx="350" cy="60" r="5" class="chart-dot" data-date="2026-11-04" data-level="1,752.50" data-power="5,240" />
                  <circle cx="450" cy="20" r="5" class="chart-dot" data-date="2026-11-05" data-level="1,755.00" data-power="5,280" />
                  <circle cx="550" cy="25" r="5" class="chart-dot" data-date="2026-11-06" data-level="1,756.10" data-power="5,270" />
                  <circle cx="650" cy="10" r="5" class="chart-dot" data-date="2026-11-07" data-level="1,758.00" data-power="5,290" />
                  <circle cx="750" cy="5" r="5" class="chart-dot" data-date="2026-11-08" data-level="1,759.16" data-power="5,298.38" />
                </svg>
              </div>
            </div>
            
            <div id="chartTooltip">
              <div class="tooltip-date" id="ttDate">날짜</div>
              <div class="tooltip-value" id="ttLevel">아이템 레벨</div>
            </div>

          </div>

          <!-- 장비 정보 패널 -->
          <div class="panel equipment-panel">
            <div class="eq-title">장비 정보</div>
            
            <div class="eq-grid">
              <div class="eq-item">무기</div>
              <div class="eq-item">머리</div>
              <div class="eq-item">어깨</div>
              <div class="eq-item">상의</div>
              <div class="eq-item">하의</div>
              <div class="eq-item">장갑</div>
            </div>
            
            <div class="extra-info">
              <div class="extra-box">보석 정보</div>
              <div class="extra-box">각인 정보</div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

   <!-- [새로 추가] 에러 모달창 -->
 <div class="modal-overlay" id="errorModal">
    <div class="error-modal">
      
      <!-- 👇 캐릭터 이미지 박스 -->
      <div class="error-icon-box">
        <img src="tear.png" alt="우는 캐릭터" onerror="this.style.display='none'"> 
      </div>
      
      <!-- 👇 에러 메시지 내용 -->
      <div class="error-content">
        <div class="error-title" id="modalErrorTitle">오류가 발생했습니다.</div>
        <div class="error-desc" id="modalErrorDesc">데이터를 불러오는 중 문제가 발생했습니다.</div>
        <button class="btn-close-modal" id="btnCloseError">확인</button>
      </div>
      
    </div>
  </div>

<script>
  // ── 1. 실시간 시간 업데이트 ──
  function updateTime() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, '0');
    const date = String(now.getDate()).padStart(2, '0');
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    const day = days[now.getDay()];
    document.getElementById('dateText').textContent = `${year}년 ${month}월 ${date}일 (${day})`;
    
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('timeText').textContent = `${hours}:${minutes}:${seconds}`;
  }
  setInterval(updateTime, 1000);
  updateTime(); 

  // ── 2. 화면 전환 로직 ──
  const mainScreen = document.getElementById('mainScreen');
  const resultScreen = document.getElementById('resultScreen');
  const charInput = document.getElementById('charInput');
  const searchBtn = document.getElementById('searchBtn');
  const btnBack = document.getElementById('btnBack');

  function searchCharacter() {
    const name = charInput.value.trim();
    if (!name) {
      showErrorModal("입력 오류", "캐릭터 이름을 입력해주세요.");
      return;
    }
    
    // 임시: 만약 검색한 이름이 '불효자의움직임'이 아니라면 에러 모달을 띄움 (테스트용)
    if (name !== "불효자의움직임") {
      showErrorModal("캐릭터 없음", `'${name}' 캐릭터를 찾을 수 없습니다. 이름을 다시 확인해주세요.`);
      return;
    }

    // 정상 검색 (화면 전환)
    mainScreen.classList.remove('active');
    resultScreen.classList.add('active');
  }

  searchBtn.addEventListener('click', searchCharacter);
  charInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') searchCharacter();
  });

  btnBack.addEventListener('click', () => {
    resultScreen.classList.remove('active');
    mainScreen.classList.add('active');
    charInput.value = ''; 
  });

  // ── 3. 에러 모달 로직 ──
  const errorModal = document.getElementById('errorModal');
  const modalErrorTitle = document.getElementById('modalErrorTitle');
  const modalErrorDesc = document.getElementById('modalErrorDesc');
  const btnCloseError = document.getElementById('btnCloseError');

  function showErrorModal(title, desc) {
    modalErrorTitle.textContent = title;
    modalErrorDesc.textContent = desc;
    errorModal.classList.add('show');
  }

  btnCloseError.addEventListener('click', () => {
    errorModal.classList.remove('show');
  });

  // ── 4. 그래프 툴팁 로직 ──
  const tooltip = document.getElementById('chartTooltip');
  const ttDate = document.getElementById('ttDate');
  const ttLevel = document.getElementById('ttLevel');
  const graphPanel = document.querySelector('.graph-panel');
  const dots = document.querySelectorAll('.chart-dot');

  dots.forEach(dot => {
    dot.addEventListener('mouseenter', (e) => {
      const date = e.target.getAttribute('data-date');
      const level = e.target.getAttribute('data-level');
      
      ttDate.textContent = date;
      ttLevel.textContent = 'Lv. ' + level;

      const dotRect = e.target.getBoundingClientRect();
      const panelRect = graphPanel.getBoundingClientRect();
      
      const x = dotRect.left - panelRect.left + dotRect.width / 2;
      const y = dotRect.top - panelRect.top;

      tooltip.style.left = x + 'px';
      tooltip.style.top = y + 'px';
      tooltip.style.display = 'block';
    });

    dot.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  });

</script>
</body>
</html>
