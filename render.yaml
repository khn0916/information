services:
  - type: web
    name: loa-information
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: LOSTARK_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
